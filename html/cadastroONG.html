<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Cadastro ONG - Bem Conecta</title>
    <link rel="stylesheet" href="../css/cadastroONG.css">
</head>
<body>

    <header>
        <div class="logos">
            <div class="logo-foto">
                <img src="../img/logo/logo.webp" loading="lazy">
            </div>
            <div class="logo-escrita">
                <img src="../img/logo/escrita.png" loading="lazy">
            </div>
        </div>

        <div class="nav-links">
            <a href="../html/cadastro.html">Voltar</a>
        </div>
    </header>

    <main class="cadastro-container">

        <div class="cadastro-card">

            <h1>Cadastro da ONG</h1>

            <form class="cadastro-form" action="../php/cadastroONG.php" method="POST">

                <div class="form-group etapa">
                    <label for="nome">Nome da ONG</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Insira o nome da ONG"
                        required
                    >
                </div>

                <div class="form-group etapa">
                    <label for="cnpj">CNPJ</label>
                    <input
                        type="text"
                        id="cnpj"
                        name="cnpj"
                        placeholder="00.000.000/0000-00"
                        maxlength="18"
                        required
                    >
                </div>

                <div class="form-group etapa">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Insira o e-mail da ONG"
                        required
                    >
                </div>

                <div class="form-group etapa">
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        maxlength="15"
                        required
                    >
                </div>

                <div class="form-group etapa">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Insira sua senha"
                        required
                    >
                </div>

                <div class="form-group etapa">
                    <label for="confirmar-senha">Confirmar Senha</label>
                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Confirme sua senha"
                        required
                    >
                </div>

                <div class="form-group etapa">
                    <label for="termos">
                        <input
                            type="checkbox"
                            id="termos"
                            name="termos"
                            required
                        >
                        Li e estou de acordo com os Termos de Uso e a Política de Privacidade da Bem Conecta.
                    </label>
                </div>

                <div class="form-group etapa">
                    <button type="submit" class="Cadastro-btn">
                        Cadastrar
                    </button>

                    <p class="login-link">
                        Já tem uma conta?
                        <a href="../html/login.html">Faça login aqui!</a>
                    </p>
                </div>

            </form>

        </div>

    </main>
</body>
</html>
