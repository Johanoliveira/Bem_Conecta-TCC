<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Cadastro ONG - Bem Conecta</title>
    <link rel="stylesheet" href="../css/cadastroONG.css">
</head>

<body>

    <header>
        <div class="logo-section">
            <img src="../img/Logo_Bem_Conecta2.png" alt="Logo Bem Conecta">
            <span>Bem Conecta</span>
        </div>

        <div class="nav-links">
            <a href="../html/cadastro.html">Voltar</a>
        </div>
    </header>

    <main class="cadastro-container">

        <div class="cadastro-card">

            <h1>Cadastro da ONG</h1>

            <form class="cadastro-form">

                <div class="form-group">
                    <label for="nome">Nome da ONG</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Insira o nome da ONG"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="cnpj">CNPJ</label>
                    <input
                        type="text"
                        id="cnpj"
                        name="cnpj"
                        placeholder="00.000.000/0000-00"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Insira o e-mail da ONG"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Insira sua senha"
                        required
                    >
                </div>

                <br>

                <div class="form-group">
                    <label for="confirmar-senha">Confirmar Senha</label>
                    <input
                        type="password"
                        id="confirmar-senha"
                        name="confirmar-senha"
                        placeholder="Confirme sua senha"
                        required
                    >
                </div>

                <br>

                <div class="form-group">
                    <label for="termos">
                        <input
                            type="checkbox"
                            id="termos"
                            name="termos"
                            required
                        >
                        Li e estou de acordo com os Termos de Uso e a Política de Privacidade da Bem Conecta.
                    </label>
                </div>

                <br>

                <button type="submit" class="Cadastro-btn">
                    Cadastrar
                </button>

              <p class="login-link">
                  Já tem uma conta?
                  <a href="../html/login.html">Faça login aqui!</a>
              </p>

            </form>

        </div>

    </main>

</body>
</html>
