<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Login - Bem Conecta</title>
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <header>
      <div class="logo-section">
        <img src="../img/Logo_Bem_Conecta2.png" alt="Logo Bem Conecta" />
        <span>Bem Conecta</span>
      </div>
      <div class="nav-links">
        <a href="../index.html">Voltar</a>
      </div>
    </header>

    <main class="login-container">
      <div class="login-card">
        <h1>Login</h1>
        <form class="login-form">
          <div class="form-group">
            <label for="email">Email ou Usuário</label>
            <input
              type="text"
              id="email"
              name="email"
              placeholder="Insira seu email ou usuário"
              required
            />
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>

            <div>
              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Insira sua senha"
                required
              />
            </div>
          </div>

          <button type="submit" class="Login-btn">Login</button>

      <footer>
        <p>&copy; 2026 Bem Conecta. Todos os direitos reservados.</p>
      </footer>
</body>
</html>
