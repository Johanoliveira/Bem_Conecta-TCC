<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Cadastro - Bem Conecta</title>
    <link rel="stylesheet" href="../css/cadastroDoador.css" />
  </head>
  <body>
    <header>
      <div class="logo-section">
        <img src="../img/Logo_Bem_Conecta2.png" alt="Logo Bem Conecta" />
        <span>Bem Conecta</span>
      </div>
      <div class="nav-links">
        <a href="../index.html">Voltar</a>
      </div>
    </header>

    <main class="cadastro-container">
      <div class="cadastro-card">
        <h1>Cadastre-se</h1>
        <form class="cadastro-form">
          <div class="form-group">
            <label for="usuario">Usuário</label>
            <input
              type="text"
              id="usuario"
              name="usuario"
              placeholder="Insira seu nome de usuário"
              required
            />
          </div>

          <div class="form-group">
            <label for="cpf">Data-Nascimento</label>
            <input
              type="date"
              id="data-nascimento"
              name="data-nascimento"
              placeholder="DD/MM/AAAA"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Insira seu email"
              required
            />
          </div>

          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input
              type="tel"
              id="telefone"
              name="telefone"
              placeholder="Insira seu telefone"
              required
            />
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>

            <div>
              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Insira sua senha"
                required
              />
          </div>
          <br>
          <div class="form-group">
            <label for="confirmar-senha">Confirmar Senha</label>
            <input
              type="password"
              id="confirmar-senha"
              name="confirmar-senha"
              placeholder="Confirme sua senha"
              required
            />
          </div>
        <br>
          <div class="form-group">
            <label for="termos">
              <input type="checkbox" id="termos" name="termos" required />
              Li e estou de acordo com os Termos de Uso e a Política de Privacidade da Bem_Conecta.
            </label>
            </div>
            <br>
          <button type="submit" class="Cadastro-btn">Cadastrar</button>
        </form>
      </div>
  </body>
</html>
