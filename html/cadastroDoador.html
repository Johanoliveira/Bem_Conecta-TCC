<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Cadastro - Bem Conecta</title>
    <link rel="stylesheet" href="../css/cadastroDoador.css" />
</head>
<body>
    <header>
    <div class="logos">
        <div class="logo-foto">
            <img src="../img/logo/logo.webp" loading="lazy">
        </div>
        <div class="logo-escrita">
            <img src="../img/logo/escrita.png" loading="lazy">
        </div>
    </div>
    <div class="nav-links">
        <a href="../html/cadastro.html">Voltar</a>
    </div>
    </header>
    <main class="cadastro-container">
    <div class="cadastro-card">
        <h1>Cadastre-se</h1>
        <form class="cadastro-form" id="cadastroForm" action="../php/cadastroDoador.php" method="POST">
        <div class="form-group etapa ativa">
            <label for="usuario">Usuário</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Insira seu nome de usuário"
                required
            >
        </div>

          <div class="form-group">
            <label for="data-nascimento">Data-Nascimento</label>
            <input
                type="date"
                id="data-nascimento"
                name="data-nascimento"
                required
            >
        </div>

        <div class="form-group etapa">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Insira seu email"
                required
            >
        </div>

        <div class="form-group etapa">
            <label for="telefone">Telefone</label>
            <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="18 99614-1236"
                maxlength="12"
                required
            >
        </div>

        <div class="form-group etapa">
            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Insira sua senha"
                required
            >
        </div>

        <div class="form-group etapa">
            <label for="confirmar-senha">Confirmar senha</label>
            <input
                type="password"
                id="confirmar-senha"
                name="confirmar-senha"
                placeholder="Confirme sua senha"
                required
            >
        </div>

        <div class="form-group etapa">
            <label class="termos">
                <input
                    type="checkbox"
                    id="termos"
                    name="termos"
                    required
                >
                Li e estou de acordo com os Termos de Uso e a Política de Privacidade da Bem Conecta.
            </label>

            <button type="submit" class="Cadastro-btn">
                Cadastrar
            </button>
        </div>
    </form>
    </div>
</body>
</html>
