<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça sua Doação</title>
    <link rel="stylesheet" href="../css/pagamento.css">
</head>
<body>

    <div class="container">

        <div class="cabecalho">
            <h1>💙 Ajude Nossa Causa</h1>
            <p>Sua doação faz a diferença na vida de muitas pessoas.</p>
        </div>

        <!-- O formulário envia os dados para o arquivo processar.php -->
        <form action="../php/pagamento.php" method="POST">

            <label class="titulo-secao">Escolha o valor da doação:</label>

            <!-- Botões de valor fixo (radio buttons estilizados como cartões) -->
            <div class="opcoes-valor">

                <label class="opcao">
                    <input type="radio" name="valor_escolhido" value="5">
                    <span>R$ 5</span>
                </label>

                <label class="opcao">
                    <input type="radio" name="valor_escolhido" value="10" checked>
                    <span>R$ 10</span>
                </label>

                <label class="opcao">
                    <input type="radio" name="valor_escolhido" value="15">
                    <span>R$ 15</span>
                </label>

            </div>

            <!-- Campo para valor personalizado. Se a pessoa digitar aqui,
                 o processar.php dá prioridade a este valor sobre o radio acima. -->
            <label class="titulo-secao" for="valor_personalizado">Ou digite outro valor:</label>
            <input
                type="number"
                id="valor_personalizado"
                name="valor_personalizado"
                placeholder="Ex: 25.00"
                min="1"
                step="0.01"
            >

            <hr>

            <label class="titulo-secao">Seus dados:</label>

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <hr>

            <label class="titulo-secao">Forma de pagamento:</label>

            <!-- ====================================================
                 ABAS SEM JAVASCRIPT
                 Truque: usamos radio buttons escondidos (um para cada
                 aba) + labels estilizados como botões. O CSS mostra o
                 conteúdo certo usando o seletor :checked. O valor do
                 radio marcado ("cartao" ou "pix") é o que chega no
                 PHP em $_POST['forma_pagamento'].
                 ==================================================== -->
            <div class="bloco-pagamento">

                <!-- Radios escondidos que controlam qual aba aparece -->
                <input type="radio" id="tab-cartao" class="aba-radio" name="forma_pagamento" value="cartao" checked>
                <input type="radio" id="tab-pix" class="aba-radio" name="forma_pagamento" value="pix">

                <!-- Botões visuais das abas (na verdade são labels dos radios acima) -->
                <div class="abas-pagamento">
                    <label for="tab-cartao" class="aba-botao">💳 Cartão</label>
                    <label for="tab-pix" class="aba-botao">📱 Pix</label>
                </div>

                <!-- Conteúdo da aba: Cartão de Crédito -->
                <div class="conteudo-aba" id="aba-cartao">
                    <!-- Escolha entre Crédito e Débito (radio + label, sem JS) -->
                    <label class="rotulo-tipo-cartao">Tipo do cartão:</label>
                    <div class="tipo-cartao">
                        <label class="tipo-cartao-opcao">
                            <input type="radio" name="tipo_cartao" value="credito" checked>
                            <span>Crédito</span>
                        </label>
                        <label class="tipo-cartao-opcao">
                            <input type="radio" name="tipo_cartao" value="debito">
                            <span>Débito</span>
                        </label>
                    </div>

                    <label for="numero_cartao">Número do cartão</label>
                    <input type="text" id="numero_cartao" name="numero_cartao" placeholder="0000 0000 0000 0000" maxlength="19">

                    <label for="nome_cartao">Nome impresso no cartão</label>
                    <input type="text" id="nome_cartao" name="nome_cartao" placeholder="Como está no cartão">

                    <div class="linha-dupla">
                        <div>
                            <label for="validade_cartao">Validade</label>
                            <input type="text" id="validade_cartao" name="validade_cartao" placeholder="MM/AA" maxlength="5">
                        </div>
                        <div>
                            <label for="cvv_cartao">CVV</label>
                            <input type="text" id="cvv_cartao" name="cvv_cartao" placeholder="123" maxlength="4">
                        </div>
                    </div>
                </div>

                <!-- Conteúdo da aba: Pix -->
                <div class="conteudo-aba" id="aba-pix">
                    <p class="texto-info">
                        Após confirmar, vamos gerar um código Pix (ou QR Code) para você copiar e pagar no app do seu banco.
                    </p>
                </div>

            </div>

            <button type="submit" class="botao-doar">Doar Agora</button>

        </form>

    </div>

</body>
</html>
